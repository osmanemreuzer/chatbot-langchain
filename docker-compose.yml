services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbotdb
    ports:
      - "5432:5432"
    volumes:
      - chatbot-postgres-data:/var/lib/postgresql/data

volumes:
  chatbot-postgres-data:
